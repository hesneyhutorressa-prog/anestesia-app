<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}3T Assistant{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f0d878;
            --gold-dark: #a8841f;
            --bg-dark: #0b0b0d;
            --bg-panel: #16161a;
            --bg-panel-2: #1f1f24;
            --border-gold: rgba(212, 175, 55, 0.35);
            --text-main: #f2f0ea;
            --text-muted: #a8a6a0;
            --ok: #3fbf6f;
            --warn: #e0a83c;
            --danger: #d9534f;
        }
        * { box-sizing: border-box; }
                        html, body { height: 100%; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("{{ url_for('static', filename='img/logo_watermark.png') }}");
            background-repeat: no-repeat;
            background-position: center 45%;
            background-size: 50%;
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        header, main {
            position: relative;
            z-index: 1;
        }
        header {
            background: linear-gradient(180deg, #141416 0%, #0b0b0d 100%);
            border-bottom: 1px solid var(--border-gold);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand img { height: 44px; width: 44px; border-radius: 50%; box-shadow: 0 0 12px rgba(212,175,55,0.5); }
        .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .brand-text .name { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; color: var(--gold-light); }
        .brand-text .tag { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-left: 22px;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        nav a:hover { color: var(--gold-light); border-color: var(--gold); }
        main { max-width: 960px; margin: 28px auto; padding: 0 16px; }
        .card {
            background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
        }
        .card h2, .card h3 { color: var(--gold-light); margin-top: 0; }
        label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; color: var(--text-muted); }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #3a3a40;
            border-radius: 8px;
            font-size: 14px;
            background: #0f0f12;
            color: var(--text-main);
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        button, .btn {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-dark) 100%);
            color: #14140f;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin-top: 18px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(212,175,55,0.35); }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #2a2a30; font-size: 14px; }
        th { color: var(--gold-light); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td a { color: var(--gold-light); }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }
        .badge-ok { background: rgba(63,191,111,0.15); color: var(--ok); border: 1px solid rgba(63,191,111,0.4); }
        .badge-warn { background: rgba(224,168,60,0.15); color: var(--warn); border: 1px solid rgba(224,168,60,0.4); }
        .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; border: 1px solid; }
        .flash-success { background: rgba(63,191,111,0.1); color: var(--ok); border-color: rgba(63,191,111,0.4); }
        .flash-error { background: rgba(217,83,79,0.1); color: #ff8b87; border-color: rgba(217,83,79,0.4); }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('main.index') }}">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="3T Assistant">
            <div class="brand-text">
                <span class="name">3T Assistant</span>
                <span class="tag">Mantenimiento · Anestesia</span>
            </div>
        </a>
        <nav>
            <a href="{{ url_for('equipos.listar') }}">Equipos</a>
            <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
