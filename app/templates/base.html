<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mantenimiento Anestesia{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        header { background: #1f4e79; color: white; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header a { color: white; text-decoration: none; }
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button, .btn { background: #1f4e79; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; margin-top: 16px; }
        button:hover, .btn:hover { background: #163a5c; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
        th { background: #eaf2fb; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-ok { background: #d5f5e3; color: #1e8449; }
        .badge-warn { background: #fdebd0; color: #7d5a00; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #d5f5e3; color: #1e8449; }
        .flash-error { background: #fadbd8; color: #943126; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
        <header>
        <h1><a href="{{ url_for('main.index') }}">🔧 Mantenimiento Anestesia</a></h1>
        <nav style="margin-top:6px;">
            <a href="{{ url_for('equipos.listar') }}" style="margin-right:16px; font-size:13px;">Equipos</a>
            <a href="{{ url_for('dashboard.index') }}" style="font-size:13px;">Dashboard</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
